version: "3.9"

services:
  watcher:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_PATH=data/watcher.db
      - LOG_FILE=logs/watcher.log
      - API_PORT=8000
      - API_HOST=0.0.0.0
