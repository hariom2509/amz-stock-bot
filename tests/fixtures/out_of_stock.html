<!DOCTYPE html>
<html lang="en">
<head>
    <title>PlayStation 5 Console : Amazon.in: Video Games</title>
    <meta name="title" content="PlayStation 5 Console"/>
</head>
<body>
<div id="dp">
  <div id="centerCol">
    <div id="productTitle">PlayStation 5 Console (PS5)</div>

    <!-- Price -->
    <div id="corePrice_feature_div">
      <span class="a-price" data-a-color="price">
        <span class="a-offscreen">₹54,990</span>
      </span>
    </div>

    <!-- Availability: clearly out of stock -->
    <div id="availability">
      <span class="a-size-medium a-color-price">Currently unavailable.</span>
    </div>

    <!-- No add to cart, no buy now -->
    <!-- Instead, notify me -->
    <input type="submit" id="notify-me-button" value="Notify Me When Available"/>
  </div>
</div>
</body>
</html>
