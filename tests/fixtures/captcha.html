<!DOCTYPE html>
<html>
<head><title>Robot Check</title></head>
<body>
<div id="g-recaptcha">
  <p>Sorry, we just need to make sure you're not a robot.</p>
  <p>Please complete the security check to access amazon.in</p>
  <form action="/errors/validateCaptcha" method="get">
    <div>
      <label>Enter the characters you see below</label>
      <input type="text" name="field-keywords"/>

  </form>
</div>
</body>
</html>
